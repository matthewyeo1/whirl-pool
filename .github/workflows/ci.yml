name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS AppleClang
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-latest
            cc: ""
            cxx: ""
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build_ci
          -DWHIRLPOOL_BUILD_TESTS=ON
          -DWHIRLPOOL_BUILD_BENCHMARKS=OFF
          -DWHIRLPOOL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build_ci --config Release --parallel

      - name: Test contracts, package, and functionality
        run: ctest --test-dir build_ci -C Release --output-on-failure

  sanitizers:
    name: Linux Clang ASan/UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build_san
          -DCMAKE_BUILD_TYPE=Debug
          -DWHIRLPOOL_BUILD_TESTS=ON
          -DWHIRLPOOL_BUILD_BENCHMARKS=OFF
          -DWHIRLPOOL_ENABLE_SANITIZERS=address-undefined

      - name: Build
        run: cmake --build build_san --parallel

      - name: Run contract checks
        run: >
          ctest --test-dir build_san --output-on-failure
          -R "^contract_"

      - name: Run supported functional groups
        run: >
          ./build_san/whirlpool_tests
          "--gtest_filter=test_pool_*:test_spsc_*:test_ring_buffer_*:test_counter_*"
